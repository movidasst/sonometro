name: Aplicar logo principal

on:
  push:
    paths:
      - '.github/workflows/aplicar-logo-principal.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar exactamente el logo que sirve www.movidasst.com
        run: |
          mkdir -p assets dist/assets
          curl -L --fail --retry 3 'https://www.movidasst.com/logo-oficial-movida-sst-plus.png' -o assets/logo-movida-sst-plus.png
          cp assets/logo-movida-sst-plus.png dist/assets/logo-movida-sst-plus.png

      - name: Volver a referencias locales del logo
        run: |
          python - <<'PY'
          from pathlib import Path
          drive = 'https://drive.google.com/uc?export=view&id=1IlAvUr0cP6LtILZobFlKRYO6aCKW26aH'
          for name in ['index.html', 'dist/index.html']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = text.replace(drive, 'assets/logo-movida-sst-plus.png')
              p.write_text(text, encoding='utf-8')
          PY

      - name: Guardar cambio y retirar workflow temporal
        run: |
          git config user.name 'David Linares'
          git config user.email 'gdochile@gmail.com'
          git rm .github/workflows/aplicar-logo-principal.yml
          git add assets/logo-movida-sst-plus.png dist/assets/logo-movida-sst-plus.png index.html dist/index.html
          git commit -m 'Usa en Sonómetro el mismo logo de www.movidasst.com'
          git push
